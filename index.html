<style>
  :root{
    --bg:#03050c; --card:#0a0f1f; --card2:#0d1530; --line:#1a2547;
    --text:#f1f4ff; --muted:#8f9bc0;
    --blue:#1f6bff; --neon:#3d9bff; --glow:rgba(45,130,255,.55);
    --chrome:linear-gradient(180deg,#ffffff 0%,#d9dee8 35%,#8a93a6 50%,#e9edf5 62%,#b8c0cf 100%);
    --wa:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(31,107,255,.25),transparent 70%),
      radial-gradient(ellipse 40% 30% at 100% 60%,rgba(31,107,255,.12),transparent 70%),
      radial-gradient(ellipse 40% 30% at 0% 90%,rgba(31,107,255,.12),transparent 70%);}
  button{font-family:inherit;cursor:pointer}
  .chrome{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 1px #000) drop-shadow(0 3px 0 #0b1a4a) drop-shadow(0 0 18px var(--glow))}
  header{position:sticky;top:0;z-index:20;background:rgba(3,5,12,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 1px 20px rgba(31,107,255,.15)}
  .bar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
  .brand img{height:44px;width:44px;border-radius:50%;object-fit:cover;border:2px solid var(--neon);box-shadow:0 0 14px var(--glow)}
  .brand span{font-family:"Russo One",sans-serif;font-size:1.25rem;font-style:italic;letter-spacing:1px;white-space:nowrap}
  .cart-btn{background:linear-gradient(180deg,var(--neon),var(--blue));color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 0 18px var(--glow);flex-shrink:0}
  .badge{background:#fff;color:var(--blue);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
  .hero{position:relative;max-width:1200px;margin:auto;padding:36px 16px 24px;text-align:center;overflow:hidden}
  .logo-ring{width:min(280px,68vw);aspect-ratio:1;margin:0 auto 10px;border-radius:50%;padding:6px;
    background:conic-gradient(from 0deg,var(--neon),#0b1a4a,#cfd6e4,#0b1a4a,var(--neon));
    box-shadow:0 0 40px var(--glow),0 0 90px rgba(31,107,255,.35);animation:pulse 3s ease-in-out infinite}
  .logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#000}
  @keyframes pulse{50%{box-shadow:0 0 60px var(--glow),0 0 120px rgba(31,107,255,.5)}}
  .streak{position:absolute;height:3px;width:40%;background:linear-gradient(90deg,transparent,var(--neon),transparent);filter:drop-shadow(0 0 6px var(--neon));transform:skewY(-18deg)}
  .s1{top:28%;left:-5%}.s2{top:58%;right:-5%}
  .crown{width:60px;margin:0 auto -6px;display:block;filter:drop-shadow(0 0 10px var(--glow))}
  .hero h1{font-family:"Russo One",sans-serif;font-style:italic;font-size:clamp(2.6rem,10vw,5.2rem);line-height:.95;text-transform:uppercase;letter-spacing:2px}
  .hero h1 small{display:block;font-size:.55em;letter-spacing:4px}
  .hero p{color:var(--muted);margin-top:12px;font-size:1.05rem}
  .cta{display:inline-block;margin-top:20px;background:linear-gradient(180deg,var(--neon),var(--blue));color:#fff;text-decoration:none;font-weight:800;padding:14px 30px;border-radius:999px;box-shadow:0 0 24px var(--glow);text-transform:uppercase;letter-spacing:1px}
  .perks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .perks div{border:1px solid var(--line);background:rgba(13,21,48,.6);border-radius:999px;padding:7px 14px;font-size:.88rem;color:#c7d1f0}
  .title{max-width:1200px;margin:18px auto 12px;padding:0 16px;font-family:"Russo One",sans-serif;font-style:italic;font-size:1.7rem;text-transform:uppercase}
  .tools{max-width:1200px;margin:auto;padding:0 16px 12px;display:flex;flex-direction:column;gap:10px}
  .search{width:100%;background:#050914;border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font-size:1rem;font-family:inherit}
  .search:focus{outline:none;border-color:var(--neon);box-shadow:0 0 10px var(--glow)}
  .row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 15px;white-space:nowrap;font-weight:600;font-size:.9rem}
  .chip.on{background:linear-gradient(180deg,var(--neon),var(--blue));border-color:var(--neon);box-shadow:0 0 12px var(--glow)}
  .count{color:var(--muted);font-size:.85rem}
  .grid{max-width:1200px;margin:auto;padding:4px 16px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}}
  .card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s;cursor:pointer}
  .card:hover{transform:translateY(-5px);border-color:var(--neon);box-shadow:0 0 26px rgba(31,107,255,.4)}
  .tag{position:absolute;top:10px;left:10px;z-index:2;background:var(--chrome);color:#06102a;font-size:.68rem;font-weight:800;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
  .ph{aspect-ratio:1/1;background:radial-gradient(circle at 50% 65%,rgba(31,107,255,.35),#050914 70%);display:grid;place-items:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover}
  .emoji{font-size:4.2rem;filter:drop-shadow(0 0 18px var(--neon));transform:rotate(-14deg)}
  .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
  .marca{color:var(--neon);font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
  .nome{font-weight:800;font-size:.98rem;line-height:1.25}
  .preco{font-family:"Russo One",sans-serif;font-size:1.3rem;margin-top:2px}
  .nums{color:var(--muted);font-size:.78rem}
  .dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #2a3561}
  .go{margin-top:auto;background:var(--chrome);color:#06102a;border:0;border-radius:10px;padding:10px;font-weight:800;text-transform:uppercase;font-size:.8rem;letter-spacing:.5px}
  .card:hover .go{background:linear-gradient(180deg,var(--neon),var(--blue));color:#fff}
  .empty{color:var(--muted);text-align:center;padding:30px 0;grid-column:1/-1}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:50;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:linear-gradient(180deg,var(--card2),var(--card));width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px;border:1px solid var(--neon);box-shadow:0 0 40px rgba(31,107,255,.35)}
  @media(min-width:640px){.ov{align-items:center}.sheet{border-radius:22px}}
  .sheet h2{font-family:"Russo One",sans-serif;font-style:italic;font-size:1.35rem;margin-bottom:2px}
  .close{float:right;background:none;border:0;color:var(--muted);font-size:1.8rem;line-height:1}
  .mph{aspect-ratio:1/1;border-radius:16px;margin:12px 0 8px;background:radial-gradient(circle at 50% 65%,rgba(31,107,255,.35),#050914 70%);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
  .mph img{width:100%;height:100%;object-fit:cover}
  .mph .emoji{font-size:6rem}
  .lbl{font-weight:700;margin:16px 0 8px;font-size:.95rem}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:64px;height:64px;padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#050914}
  .sw img{width:100%;height:100%;object-fit:cover;display:block}
  .sw i{width:24px;height:24px;border-radius:50%;border:1px solid #3a4570;display:block}
  .sw.on{border-color:var(--neon);box-shadow:0 0 12px var(--glow);transform:scale(1.06)}
  .optlbl{color:var(--muted);font-size:.85rem;margin-top:6px}
  .more{color:var(--neon);font-size:.78rem;font-weight:700}
  .sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
  .size{background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:11px 0;font-weight:800}
  .size.wide{grid-column:1/-1}
  .size.on{background:linear-gradient(180deg,var(--neon),var(--blue));border-color:var(--neon);box-shadow:0 0 12px var(--glow)}
  .primary{width:100%;margin-top:20px;background:linear-gradient(180deg,var(--neon),var(--blue));color:#fff;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:1rem;text-transform:uppercase;box-shadow:0 0 18px var(--glow)}
  .primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .wa{background:var(--wa);box-shadow:0 0 18px rgba(37,211,102,.4)}
  .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .item small{color:var(--muted)}
  .rm{background:none;border:0;color:#f87171;font-size:.85rem}
  .total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;margin-top:14px}
  .pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pay{background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-weight:600;font-size:.9rem}
  .pay.on{border-color:var(--neon);background:rgba(31,107,255,.18);box-shadow:0 0 10px var(--glow)}
  input,textarea{width:100%;background:#050914;border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-family:inherit;font-size:.95rem;margin-bottom:8px}
  input:focus,textarea:focus{outline:none;border-color:var(--neon)}
  .err{color:#f87171;font-size:.88rem;min-height:1.2em;margin-top:6px}
  .frow{display:flex;gap:8px;align-items:center}
  .frow input{flex:1;min-width:0}
  .cepmsg{color:var(--muted);font-size:.8rem;white-space:nowrap;margin-bottom:8px}
  .note{color:var(--muted);font-size:.82rem;margin:2px 0 8px}
  input.bad{border-color:#f87171}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(180deg,var(--neon),var(--blue));color:#fff;padding:12px 22px;border-radius:999px;font-weight:800;transition:transform .3s;z-index:60;box-shadow:0 0 20px var(--glow);white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
  footer{border-top:1px solid var(--line);text-align:center;padding:28px 16px 90px;color:var(--muted);font-size:.88rem}
  footer strong{font-family:"Russo One",sans-serif;font-style:italic;font-size:1.2rem}
  .fab{position:fixed;right:18px;bottom:18px;background:var(--wa);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:15}
  .fab svg{width:30px;height:30px;fill:#fff}
  .credit{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(127,127,127,.18);font-size:.78rem;color:var(--muted);text-decoration:none}
  .credit img{height:26px;width:auto;opacity:.9}
  .credit b{font-weight:700;letter-spacing:.5px}
  .kr .kr-bg{fill:#F7F5F0}.kr .kr-fg{stroke:#13213C}
  .krn{font-size:.9rem;letter-spacing:-.01em}.krn span{font-weight:400}.krn b{font-weight:800}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="#" id="brand"></a>
    <button class="cart-btn" onclick="abrirSacola()">🛍️ Sacola <span class="badge" id="count">0</span></button>
  </div>
</header>

<section class="hero">
  <div class="streak s1"></div><div class="streak s2"></div>
  <div class="logo-ring" id="logoRing"><img id="logoBig" alt=""></div>
  <svg class="crown" viewBox="0 0 64 40"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#8a93a6"/><stop offset="1" stop-color="#e9edf5"/></linearGradient></defs><path d="M4 34 L8 10 L20 22 L32 4 L44 22 L56 10 L60 34 Z" fill="url(#cg)" stroke="#0b1a4a" stroke-width="2"/><rect x="4" y="33" width="56" height="5" rx="2" fill="url(#cg)" stroke="#0b1a4a" stroke-width="1.5"/></svg>
  <h1 class="chrome" id="heroNome"></h1>
  <p id="slogan"></p>
  <a class="cta" href="#vitrine">Ver modelos</a>
  <div class="perks">
    <div>⚡ Pedido rápido pelo WhatsApp</div>
    <div>💳 Várias formas de pagamento</div>
  </div>
</section>

<h2 class="title chrome" id="vitrine">Modelos</h2>
<div class="tools">
  <input class="search" id="busca" placeholder="🔎 Buscar modelo... (ex: Air Force, Dunk, 9060)" oninput="desenharGrade()">
  <div class="row" id="filters"></div>
  <div class="row" id="grades"></div>
  <div class="count" id="qtd"></div>
</div>
<main class="grid" id="grid"></main>

<footer id="footer"></footer>
<a class="fab" id="fab" target="_blank" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.6-.3z"/></svg></a>

<div class="ov" id="ovProd" onclick="if(event.target===this)fechar('ovProd')">
  <div class="sheet">
    <button class="close" onclick="fechar('ovProd')">×</button>
    <div class="marca" id="mMarca"></div>
    <h2 id="mNome"></h2>
    <div class="preco chrome" id="mPreco"></div>
    <div class="mph" id="mFoto"></div>
    <div id="mCoresBox"><div class="lbl">Escolha a cor / modelo</div><div class="swatches" id="mCores"></div><div class="optlbl" id="mOpt"></div></div>
    <div class="lbl">Escolha a numeração</div>
    <div class="sizes" id="mSizes"></div>
    <button class="primary" id="mAdd" disabled onclick="adicionar()">Adicionar à sacola</button>
  </div>
</div>

<div class="ov" id="ovCart" onclick="if(event.target===this)fechar('ovCart')">
  <div class="sheet">
    <button class="close" onclick="fechar('ovCart')">×</button>
    <h2>Sua sacola</h2>
    <div id="cItens"></div>
    <div id="cFinal">
      <div class="total"><span>Total</span><span id="cTotal"></span></div>
      <div class="lbl">Forma de pagamento</div>
      <div class="pays" id="cPays"></div>
      <div class="lbl">Seus dados</div>
      <input id="cNome" placeholder="Nome completo *" autocomplete="name">
      <input id="cTel" placeholder="Telefone / WhatsApp" inputmode="tel" autocomplete="tel">
      <div class="lbl">Entrega</div>
      <div class="pays" id="cEnt">
        <button class="pay" data-e="Correios" onclick="selEntrega(this)">📦 Enviar pelos Correios</button>
        <button class="pay" data-e="Retirar / combinar" onclick="selEntrega(this)">🤝 Retirar ou combinar</button>
      </div>
      <div id="cEnd" style="display:none;margin-top:10px">
        <div class="frow"><input id="cCep" placeholder="CEP *" inputmode="numeric" maxlength="9" autocomplete="postal-code" oninput="mascCep(this)"><span class="cepmsg" id="cCepMsg"></span></div>
        <input id="cRua" placeholder="Rua / Avenida *" autocomplete="address-line1">
        <div class="frow"><input id="cNum" placeholder="Número *" inputmode="numeric"><input id="cComp" placeholder="Complemento"></div>
        <input id="cBairro" placeholder="Bairro *">
        <div class="frow"><input id="cCidade" placeholder="Cidade *" autocomplete="address-level2"><input id="cUf" placeholder="UF *" maxlength="2" style="max-width:80px;text-transform:uppercase"></div>
        <input id="cCpf" placeholder="CPF (para a etiqueta dos Correios)" inputmode="numeric" maxlength="14" oninput="mascCpf(this)">
        <div class="note">O valor do frete é combinado pelo WhatsApp.</div>
      </div>
      <textarea id="cObs" rows="2" placeholder="Observação (opcional)"></textarea>
      <div class="err" id="cErr"></div>
      <button class="primary wa" onclick="enviar()">Enviar pedido pelo WhatsApp</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Adicionado à sacola! ⚡</div>

<script>
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $ = id => document.getElementById(id);
let sacola = [], atual = null, corSel = 0, numSel = null, pagSel = null, filtro = "Todos", gradeF = "Todas";

// Cada produto tem pelo menos uma "cor"; foto padrão = fotos/<id>.jpg
PRODUTOS.forEach(p => {
  if (!p.cores || !p.cores.length) {
    const n = FOTOS[p.id] || 0;
    p.cores = n ? Array.from({length:n},(_,k)=>({ nome:`Opção ${k+1}`, foto:`fotos/${p.id}-${k+1}.jpg`, numeracoes:p.numeracoes }))
                : [{ nome:"", foto:"", numeracoes:p.numeracoes }];
  }
  p.cores.forEach(c => { if (!c.numeracoes) c.numeracoes = p.numeracoes; });
  p.todasNums = [...new Set(p.cores.flatMap(c => c.numeracoes))];
});

const fotoHTML = (src, alt) => src ? `<img src="${src}" alt="${alt}" loading="lazy" onerror="this.outerHTML='<span class=emoji>👟</span>'">` : `<span class="emoji">👟</span>`;
const faixa = n => { const nn = n.filter(x => typeof x === "number"); return nn.length ? (nn.length > 2 ? `${Math.min(...nn)} ao ${Math.max(...nn)}` : nn.join(" e ")) : "Consultar"; };

// Marca e textos
document.title = LOJA.nome;
const partes = LOJA.nome.split(" ");
$("heroNome").innerHTML = partes.length > 1 ? `${partes[0]}<small>${partes.slice(1).join(" ")}</small>` : LOJA.nome;
$("slogan").textContent = LOJA.slogan;
$("footer").innerHTML = `<strong class="chrome">${LOJA.nome}</strong>${LOJA.cidade ? "<br>"+LOJA.cidade : ""}` + `<a class="credit" href="${LOJA.creditoLink || "#"}" target="_blank" rel="noopener">Desenvolvido por <svg class="kr" viewBox="0 0 120 120" width="26" height="26" role="img" aria-label="Studio Kairós"><rect class="kr-bg" width="120" height="120" rx="28"></rect><g class="kr-fg" transform="translate(0 8)" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 42 A12 12 0 0 1 34 30 H86 A12 12 0 0 1 98 42 V70 A12 12 0 0 1 86 82 H34 A12 12 0 0 1 22 70 Z"></path><path d="M42 30 V25 A4 4 0 0 1 46 21 H60 A4 4 0 0 1 64 25 V30"></path><circle cx="62" cy="56" r="14"></circle></g><circle cx="85" cy="52" r="5" fill="#D9A441"></circle><path d="M62 55 V73 M55.5 61 H68.5" fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round"></path></svg><span class="krn"><span>Studio</span> <b>Kairós</b></span></a>`;
$("fab").href = `https://wa.me/${LOJA.whatsapp}`;
const nomeTexto = `<span class="chrome">${LOJA.nome}</span>`;
$("brand").innerHTML = `<img src="${LOJA.logo}" alt="" onerror="this.remove()">${nomeTexto}`;
$("logoBig").src = LOJA.logo; $("logoBig").alt = LOJA.nome;
$("logoBig").onerror = () => $("logoRing").style.display = "none";

function desenharFiltros(){
  const marcas = ["Todos", "Importados", ...[...new Set(PRODUTOS.map(p=>p.marca))].sort((a,b)=>{
    const ca = PRODUTOS.filter(p=>p.marca===a).length, cb = PRODUTOS.filter(p=>p.marca===b).length; return cb-ca || a.localeCompare(b);
  })];
  $("filters").innerHTML = marcas.map(m => `<button class="chip ${m===filtro?'on':''}" onclick="filtro='${m}';desenharFiltros();desenharGrade()">${m}</button>`).join("");
  const gs = ["Todas","Masculino (38–43)","Feminino (34–39)","Especial (44+)"];
  $("grades").innerHTML = gs.map(g => `<button class="chip ${g===gradeF?'on':''}" onclick="gradeF='${g}';desenharFiltros();desenharGrade()">${g}</button>`).join("");
}

function passa(p){
  if (filtro === "Importados" && !p.destaque) return false;
  if (filtro !== "Todos" && filtro !== "Importados" && p.marca !== filtro) return false;
  const n = p.todasNums;
  if (gradeF.startsWith("Masc") && !n.some(x => x >= 40 && x <= 43)) return false;
  if (gradeF.startsWith("Fem")  && !n.some(x => x >= 34 && x <= 37)) return false;
  if (gradeF.startsWith("Esp")  && !n.some(x => x >= 44)) return false;
  const q = $("busca").value.trim().toLowerCase();
  if (q && !(p.nome + " " + p.marca).toLowerCase().includes(q)) return false;
  return true;
}

function desenharGrade(){
  const lista = PRODUTOS.map((p,i)=>({p,i})).filter(o => passa(o.p));
  $("qtd").textContent = `${lista.length} modelo${lista.length===1?"":"s"}`;
  $("grid").innerHTML = lista.length ? lista.map(({p,i}) => `
    <article class="card" onclick="abrirProduto(${i})">
      ${p.destaque ? '<span class="tag">Importado</span>' : ''}
      <div class="ph">${fotoHTML(p.cores[0].foto, p.nome)}</div>
      <div class="info">
        <div class="marca">${p.marca}</div>
        <div class="nome">${p.nome}</div>
        <div class="preco chrome">${brl(p.preco)}</div>
        ${p.cores.length > 1 ? `<div class="more">+ ${p.cores.length} opções de cor</div>` : ""}
        <div class="nums">Numeração: ${faixa(p.todasNums)}</div>
        <button class="go">Escolher</button>
      </div>
    </article>`).join("") : `<div class="empty">Nenhum modelo encontrado 👟</div>`;
}

function abrirProduto(i){
  atual = PRODUTOS[i]; corSel = 0;
  $("mMarca").textContent = atual.marca;
  $("mNome").textContent = atual.nome;
  $("mPreco").textContent = brl(atual.preco);
  $("mCoresBox").style.display = atual.cores.length > 1 ? "block" : "none";
  mostrarCor();
  $("ovProd").classList.add("show");
}
function mostrarCor(){
  const c = atual.cores[corSel]; numSel = null; $("mAdd").disabled = true;
  $("mFoto").innerHTML = fotoHTML(c.foto, atual.nome);
  $("mPreco").textContent = brl(c.preco || atual.preco);
  $("mOpt").textContent = atual.cores.length > 1 ? `Selecionado: ${c.nome} de ${atual.cores.length}` : "";
  $("mCores").innerHTML = atual.cores.map((k,j) => `<button class="sw ${j===corSel?'on':''}" onclick="corSel=${j};mostrarCor()" aria-label="${k.nome}"><img src="${k.foto}" alt="" loading="lazy"></button>`).join("");
  $("mSizes").innerHTML = c.numeracoes.map(n => `<button class="size ${typeof n==='string'?'wide':''}" onclick="selNum(this,'${n}')">${n === "Consultar" ? "Consultar numeração no WhatsApp" : n}</button>`).join("");
}
function selNum(el,n){
  numSel = n;
  document.querySelectorAll(".size").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");
  $("mAdd").disabled = false;
}
function adicionar(){
  const c = atual.cores[corSel];
  const cod = c.foto ? c.foto.replace(/^fotos\//,"").replace(/\.jpg$/,"").toUpperCase() : "";
  const link = c.foto ? new URL(c.foto, location.href).href : "";
  sacola.push({ nome: atual.nome, marca: atual.marca, cor: c.nome, preco: c.preco || atual.preco, num: numSel, cod, link });
  $("count").textContent = sacola.length; fechar("ovProd");
  $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),1800);
}

function abrirSacola(){
  $("cErr").textContent = "";
  if(!sacola.length){ $("cItens").innerHTML = `<div class="empty">Sua sacola está vazia 👟</div>`; $("cFinal").style.display="none"; }
  else{
    $("cFinal").style.display="block";
    $("cItens").innerHTML = sacola.map((s,i)=>`
      <div class="item"><div><strong>${s.nome}</strong><br><small>${s.cod ? "Cód. "+s.cod+" · " : ""}Nº ${s.num}</small></div>
      <div style="text-align:right">${brl(s.preco)}<br><button class="rm" onclick="remover(${i})">remover</button></div></div>`).join("");
    $("cTotal").textContent = brl(sacola.reduce((a,s)=>a+s.preco,0));
    $("cPays").innerHTML = LOJA.pagamentos.map(p => `<button class="pay ${p===pagSel?'on':''}" onclick="pagSel='${p}';abrirSacola()">${p}</button>`).join("");
  }
  $("ovCart").classList.add("show");
}
function remover(i){ sacola.splice(i,1); $("count").textContent = sacola.length; abrirSacola(); }
function fechar(id){ $(id).classList.remove("show"); }

let entSel = null;
function selEntrega(el){
  entSel = el.dataset.e;
  document.querySelectorAll("#cEnt .pay").forEach(b=>b.classList.toggle("on", b===el));
  $("cEnd").style.display = entSel === "Correios" ? "block" : "none";
}
function mascCpf(el){
  let v = el.value.replace(/\D/g,"").slice(0,11);
  v = v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  el.value = v;
}
function mascCep(el){
  let v = el.value.replace(/\D/g,"").slice(0,8);
  el.value = v.length > 5 ? v.slice(0,5)+"-"+v.slice(5) : v;
  if (v.length === 8) buscarCep(v);
}
async function buscarCep(cep){
  $("cCepMsg").textContent = "buscando...";
  try{
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d = await r.json();
    if (d.erro) { $("cCepMsg").textContent = "CEP não encontrado"; return; }
    if (d.logradouro) $("cRua").value = d.logradouro;
    if (d.bairro) $("cBairro").value = d.bairro;
    $("cCidade").value = d.localidade || ""; $("cUf").value = d.uf || "";
    $("cCepMsg").textContent = "✓ endereço encontrado";
    ($("cRua").value ? $("cNum") : $("cRua")).focus();
  }catch(e){ $("cCepMsg").textContent = "preencha manualmente"; }
}
const val = id => $(id).value.trim();

function enviar(){
  const nome = val("cNome"), obs = val("cObs"), tel = val("cTel");
  document.querySelectorAll("#cFinal input").forEach(i=>i.classList.remove("bad"));
  const erro = (m,id) => { $("cErr").textContent = m; if(id){ $(id).classList.add("bad"); $(id).focus(); } };
  if(!pagSel) return erro("Escolha a forma de pagamento.");
  if(!nome) return erro("Digite seu nome.","cNome");
  if(!entSel) return erro("Escolha como quer receber.");
  let endereco = "";
  if (entSel === "Correios") {
    for (const [id,n] of [["cCep","o CEP"],["cRua","a rua"],["cNum","o número"],["cBairro","o bairro"],["cCidade","a cidade"],["cUf","a UF"]])
      if (!val(id)) return erro(`Preencha ${n}.`, id);
    if (val("cCep").replace(/\D/g,"").length !== 8) return erro("CEP inválido.","cCep");
    endereco = `${val("cRua")}, ${val("cNum")}${val("cComp") ? " - "+val("cComp") : ""}\n${val("cBairro")} - ${val("cCidade")}/${val("cUf").toUpperCase()}\nCEP: ${val("cCep")}`;
  }
  $("cErr").textContent = "";
  let msg = `*NOVO PEDIDO - ${LOJA.nome}*\n\n*Cliente:* ${nome}${tel ? "\n*Telefone:* "+tel : ""}${val("cCpf") ? "\n*CPF:* "+val("cCpf") : ""}\n\n`;
  sacola.forEach((s,i)=>{ msg += `${i+1}. ${s.nome}${s.cor ? " - "+s.cor : ""}\n   Código: ${s.cod || "-"}\n   Numeração: ${s.num} | ${brl(s.preco)}\n${s.link ? "   Foto: "+s.link+"\n" : ""}`; });
  msg += `\n*Total:* ${brl(sacola.reduce((a,s)=>a+s.preco,0))}\n*Pagamento:* ${pagSel}`;
  msg += `\n*Entrega:* ${entSel}`;
  if (endereco) msg += `\n*Endereço:*\n${endereco}\n_(frete a combinar)_`;
  if(obs) msg += `\n*Obs:* ${obs}`;
  window.open(`https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
}

document.addEventListener("input", e => { if (e.target.classList.contains("bad")) { e.target.classList.remove("bad"); $("cErr").textContent = ""; } });
desenharFiltros(); desenharGrade();
</script>
</body>
</html>
