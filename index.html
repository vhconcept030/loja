<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja de Tênis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* =========================================================
   CONFIGURAÇÃO DA LOJA — EDITE SÓ ESTA PARTE
   ========================================================= */
const LOJA = {
  nome: "SNEAKER STORE",                 // Nome da loja
  slogan: "Seu próximo passo começa aqui",
  logo: "",                              // Ex: "logo.png" (suba o arquivo junto). Vazio = mostra o nome
  whatsapp: "5518999999999",             // 55 + DDD + número, só números
  cidade: "Dracena - SP",
  pagamentos: ["Pix", "Cartão de crédito", "Cartão de débito", "Dinheiro"]
};

/* Cada tênis: nome, marca, preco, foto (link ou arquivo), numeracoes disponíveis.
   Para tirar um número de estoque, é só apagar ele da lista. */
const PRODUTOS = [
  { nome: "Air Runner Pro",   marca: "Marca A", preco: 399.90, foto: "", numeracoes: [37,38,39,40,41,42,43] },
  { nome: "Street Classic",   marca: "Marca B", preco: 289.90, foto: "", numeracoes: [34,35,36,37,38,39] },
  { nome: "Urban Flex",       marca: "Marca C", preco: 349.90, foto: "", numeracoes: [38,39,40,41,42] },
  { nome: "Court Retro",      marca: "Marca A", preco: 459.90, foto: "", numeracoes: [39,40,41,42,43,44] },
  { nome: "Daily Comfort",    marca: "Marca D", preco: 199.90, foto: "", numeracoes: [33,34,35,36,37,38,39,40] },
  { nome: "Trail Max",        marca: "Marca B", preco: 529.90, foto: "", numeracoes: [40,41,42,43] }
];
/* ========================================================= */
</script>
<style>
  :root{
    --bg:#0e0e10; --card:#18181c; --line:#2a2a30; --text:#f4f4f5; --muted:#a1a1aa;
    --accent:#ff5a1f; --accent2:#ffb800; --ok:#22c55e; --wa:#25d366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  header{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .brand{display:flex;align-items:center;gap:10px;font-family:"Archivo Black",sans-serif;font-size:1.25rem;letter-spacing:.5px}
  .brand img{height:42px;width:auto}
  .cart-btn{position:relative;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;display:flex;gap:8px;align-items:center}
  .badge{background:#fff;color:var(--accent);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
  .hero{max-width:1150px;margin:auto;padding:56px 16px 36px;text-align:center}
  .hero h1{font-family:"Archivo Black",sans-serif;font-size:clamp(2rem,6vw,3.8rem);line-height:1.05;text-transform:uppercase}
  .hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin-top:12px;font-size:1.05rem}
  .perks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
  .perks div{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.88rem;color:var(--muted)}
  .filters{max-width:1150px;margin:auto;padding:0 16px 18px;display:flex;gap:8px;overflow-x:auto}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 16px;white-space:nowrap;font-weight:500}
  .chip.on{background:var(--text);color:var(--bg)}
  .grid{max-width:1150px;margin:auto;padding:0 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-4px);border-color:var(--accent)}
  .ph{aspect-ratio:1/1;background:radial-gradient(circle at 50% 60%,#2b2b33,#141417);display:grid;place-items:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph .emoji{font-size:5rem;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));transform:rotate(-12deg)}
  .info{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .marca{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1px}
  .nome{font-weight:700;font-size:1.08rem}
  .preco{font-size:1.3rem;font-weight:800;color:var(--accent2)}
  .parc{color:var(--muted);font-size:.82rem}
  .card button{margin-top:auto;background:var(--text);color:var(--bg);border:0;border-radius:12px;padding:12px;font-weight:700}
  .card button:hover{background:var(--accent);color:#fff}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:50;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 18px 26px;border:1px solid var(--line)}
  @media(min-width:640px){.ov{align-items:center}.sheet{border-radius:22px}}
  .sheet h2{font-family:"Archivo Black",sans-serif;font-size:1.35rem;margin-bottom:4px}
  .close{float:right;background:none;border:0;color:var(--muted);font-size:1.6rem;line-height:1}
  .lbl{font-weight:600;margin:18px 0 8px;font-size:.95rem}
  .sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
  .size{background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:11px 0;font-weight:700}
  .size.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .primary{width:100%;margin-top:20px;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:1rem}
  .primary:disabled{opacity:.4;cursor:not-allowed}
  .wa{background:var(--wa)}
  .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .item small{color:var(--muted)}
  .rm{background:none;border:0;color:#f87171;font-size:.85rem}
  .total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:800;margin-top:14px}
  .pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pay{background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-weight:600;font-size:.9rem}
  .pay.on{border-color:var(--accent);background:rgba(255,90,31,.12)}
  input,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-family:inherit;font-size:.95rem;margin-bottom:8px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;transition:transform .3s;z-index:60}
  .toast.show{transform:translateX(-50%) translateY(0)}
  footer{border-top:1px solid var(--line);text-align:center;padding:26px 16px;color:var(--muted);font-size:.88rem}
  .fab{position:fixed;right:18px;bottom:18px;background:var(--wa);color:#fff;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:15}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand" id="brand"></div>
    <button class="cart-btn" onclick="abrirSacola()">🛍️ Sacola <span class="badge" id="count">0</span></button>
  </div>
</header>

<section class="hero">
  <h1>Estilo que <span>anda com você</span></h1>
  <p id="slogan"></p>
  <div class="perks">
    <div>✅ Pedido rápido pelo WhatsApp</div>
    <div>📦 Pronta entrega</div>
    <div>💳 Várias formas de pagamento</div>
  </div>
</section>

<div class="filters" id="filters"></div>
<main class="grid" id="grid"></main>

<footer id="footer"></footer>
<a class="fab" id="fab" target="_blank" aria-label="WhatsApp">💬</a>

<!-- Modal: escolher numeração -->
<div class="ov" id="ovProd" onclick="if(event.target===this)fechar('ovProd')">
  <div class="sheet">
    <button class="close" onclick="fechar('ovProd')">×</button>
    <div class="marca" id="mMarca"></div>
    <h2 id="mNome"></h2>
    <div class="preco" id="mPreco"></div>
    <div class="lbl">Escolha a numeração</div>
    <div class="sizes" id="mSizes"></div>
    <button class="primary" id="mAdd" disabled onclick="adicionar()">Adicionar à sacola</button>
  </div>
</div>

<!-- Modal: sacola e finalização -->
<div class="ov" id="ovCart" onclick="if(event.target===this)fechar('ovCart')">
  <div class="sheet">
    <button class="close" onclick="fechar('ovCart')">×</button>
    <h2>Sua sacola</h2>
    <div id="cItens"></div>
    <div id="cFinal">
      <div class="total"><span>Total</span><span id="cTotal"></span></div>
      <div class="lbl">Forma de pagamento</div>
      <div class="pays" id="cPays"></div>
      <div class="lbl">Seus dados</div>
      <input id="cNome" placeholder="Seu nome *">
      <textarea id="cObs" rows="2" placeholder="Endereço ou observação (opcional)"></textarea>
      <button class="primary wa" id="cEnviar" onclick="enviar()">Enviar pedido pelo WhatsApp</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Adicionado à sacola!</div>

<script>
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let sacola = [], atual = null, numSel = null, pagSel = null, filtro = "Todos";

// Cabeçalho, rodapé e textos
document.title = LOJA.nome;
document.getElementById("brand").innerHTML = LOJA.logo ? `<img src="${LOJA.logo}" alt="${LOJA.nome}">` : LOJA.nome;
document.getElementById("slogan").textContent = LOJA.slogan;
document.getElementById("footer").innerHTML = `<strong>${LOJA.nome}</strong><br>${LOJA.cidade}`;
document.getElementById("fab").href = `https://wa.me/${LOJA.whatsapp}`;

// Filtros por marca
function desenharFiltros(){
  const marcas = ["Todos", ...new Set(PRODUTOS.map(p=>p.marca))];
  document.getElementById("filters").innerHTML = marcas.map(m =>
    `<button class="chip ${m===filtro?'on':''}" onclick="filtro='${m}';desenharFiltros();desenharGrade()">${m}</button>`).join("");
}

// Vitrine
function desenharGrade(){
  const lista = PRODUTOS.map((p,i)=>({...p,i})).filter(p=>filtro==="Todos"||p.marca===filtro);
  document.getElementById("grid").innerHTML = lista.map(p => `
    <article class="card">
      <div class="ph">${p.foto ? `<img src="${p.foto}" alt="${p.nome}" loading="lazy">` : `<span class="emoji">👟</span>`}</div>
      <div class="info">
        <div class="marca">${p.marca}</div>
        <div class="nome">${p.nome}</div>
        <div class="preco">${brl(p.preco)}</div>
        <div class="parc">Números: ${p.numeracoes[0]} ao ${p.numeracoes[p.numeracoes.length-1]}</div>
        <button onclick="abrirProduto(${p.i})">Escolher numeração</button>
      </div>
    </article>`).join("");
}

function abrirProduto(i){
  atual = PRODUTOS[i]; numSel = null;
  document.getElementById("mMarca").textContent = atual.marca;
  document.getElementById("mNome").textContent = atual.nome;
  document.getElementById("mPreco").textContent = brl(atual.preco);
  document.getElementById("mAdd").disabled = true;
  document.getElementById("mSizes").innerHTML = atual.numeracoes.map(n =>
    `<button class="size" onclick="selNum(this,${n})">${n}</button>`).join("");
  document.getElementById("ovProd").classList.add("show");
}
function selNum(el,n){
  numSel = n;
  document.querySelectorAll(".size").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");
  document.getElementById("mAdd").disabled = false;
}
function adicionar(){
  sacola.push({nome:atual.nome, marca:atual.marca, preco:atual.preco, num:numSel});
  atualizarContador(); fechar("ovProd");
  const t = document.getElementById("toast"); t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);
}
function atualizarContador(){ document.getElementById("count").textContent = sacola.length; }

function abrirSacola(){
  const itens = document.getElementById("cItens"), fin = document.getElementById("cFinal");
  if(!sacola.length){ itens.innerHTML = `<div class="empty">Sua sacola está vazia 👟</div>`; fin.style.display="none"; }
  else{
    fin.style.display="block";
    itens.innerHTML = sacola.map((s,i)=>`
      <div class="item"><div><strong>${s.nome}</strong><br><small>${s.marca} · Nº ${s.num}</small></div>
      <div style="text-align:right">${brl(s.preco)}<br><button class="rm" onclick="remover(${i})">remover</button></div></div>`).join("");
    document.getElementById("cTotal").textContent = brl(sacola.reduce((a,s)=>a+s.preco,0));
    document.getElementById("cPays").innerHTML = LOJA.pagamentos.map(p =>
      `<button class="pay ${p===pagSel?'on':''}" onclick="pagSel='${p}';abrirSacola()">${p}</button>`).join("");
  }
  document.getElementById("ovCart").classList.add("show");
}
function remover(i){ sacola.splice(i,1); atualizarContador(); abrirSacola(); }
function fechar(id){ document.getElementById(id).classList.remove("show"); }

function enviar(){
  const nome = document.getElementById("cNome").value.trim();
  const obs = document.getElementById("cObs").value.trim();
  if(!pagSel){ alert("Escolha a forma de pagamento."); return; }
  if(!nome){ alert("Digite seu nome."); return; }
  let msg = `*NOVO PEDIDO - ${LOJA.nome}*\n\n*Cliente:* ${nome}\n\n`;
  sacola.forEach((s,i)=>{ msg += `${i+1}. ${s.nome} (${s.marca})\n   Numeração: ${s.num} | ${brl(s.preco)}\n`; });
  msg += `\n*Total:* ${brl(sacola.reduce((a,s)=>a+s.preco,0))}\n*Pagamento:* ${pagSel}`;
  if(obs) msg += `\n*Obs:* ${obs}`;
  window.open(`https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
}

desenharFiltros(); desenharGrade();
</script>
</body>
</html>
